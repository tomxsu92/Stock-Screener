name: Update stock data

on:
  schedule:
    # Weekdays at 22:30 UTC (2:30 PM Pacific), after the US market closes
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}   # lets you click "Run workflow" on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data and score stocks
        run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update stock data $(date -u +'%Y-%m-%d')"
            git push
          fi
